<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lokasi FishingSpot</title>
    <script>
        window.onload = function() {
            // Ambil data lat, lng, dan name dari link
            var queryString = window.location.search;
            
            // Kod ajaib Android: Buka app FishingSpot, kalau tiada, buka Play Store
            // NOTA: Pastikan 'com.legadigital.tide_app' adalah nama pakej App anda yang sebenar
            window.location.href = "intent://spot" + queryString + "#Intent;scheme=fishingspot;package=com.legadigital.tide_app;end;";
        };
    </script>
</head>
<body style="background-color: #f4f6f8; font-family: sans-serif; text-align: center; padding-top: 20vh;">
    <h1 style="color: #007bff;">🎣 FishingSpot</h1>
    <h3>Sedang membuka lokasi memancing...</h3>
    <p style="color: gray; padding: 20px;">
        Sila tunggu sebentar. Jika anda belum memuat turun aplikasi, <br>
        anda akan dibawa terus ke Google Play Store.
    </p>
</body>
</html>
